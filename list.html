<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文件夹列表</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f7f9;
    color: #1f2328;
    line-height: 1.6;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 26px 16px 60px; }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  h1 { font-size: 1.35rem; }
  button {
    font: inherit;
    font-size: .88rem;
    background: #fff;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover { background: #f0f3f6; }

  .summary { color: #7a828c; font-size: .85rem; margin-bottom: 16px; }

  .msg {
    background: #fff8e6;
    border: 1px solid #f0d48a;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: .9rem;
    margin-bottom: 14px;
    display: none;
  }
  .msg.show { display: block; }
  .msg code {
    background: #f2e8c9;
    border-radius: 4px;
    padding: 1px 6px;
    font-family: Consolas, monospace;
  }

  .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #fff;
    border: 1px solid #e3e6ea;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 10px;
    text-decoration: none;
    color: inherit;
  }
  .card:hover { border-color: #4a9eff; background: #f5f9ff; transform: translateX(4px); }
  .card .name { font-weight: 700; font-size: 1.02rem; color: #0969da; word-break: break-all; }
  .card:hover .name { text-decoration: underline; }
  .card .go { color: #7a828c; font-size: .85rem; flex-shrink: 0; }

  .empty { text-align: center; color: #7a828c; padding: 60px 0; }
  footer { text-align: center; color: #9aa0a6; font-size: .78rem; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📁 文件夹列表</h1>
    <button id="refreshBtn">🔄 刷新</button>
  </header>

  <div class="summary" id="summary"></div>
  <div class="msg" id="msg"></div>
  <main id="list"></main>

  <footer>点击文件夹直接打开其中的 index 页面 · 需通过本地服务器访问（python -m http.server）</footer>
</div>

<script>
(() => {
  "use strict";

  const MARKER = "DIRLIST_PAGE_V3";

  const listEl = document.getElementById("list");
  const msgEl = document.getElementById("msg");
  const summaryEl = document.getElementById("summary");

  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));

  const safeDecode = (s) => {
    try { return decodeURIComponent(s); } catch (e) { return s; }
  };

  const isListing = (text) => /Directory listing for/i.test(text) || /Index of \//i.test(text);

  /* 解析根目录列表，拿到所有子文件夹 */
  async function parseRoot() {
    const res = await fetch("./", { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    if (text.includes(MARKER)) throw new Error("shadowed");
    if (!isListing(text)) throw new Error("shadowed");
    const doc = new DOMParser().parseFromString(text, "text/html");
    const dirs = [];
    doc.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href || /^(\/|\.\.|#|\?|https?:|mailto:)/i.test(href)) return;
      if (href.endsWith("/")) dirs.push({ name: safeDecode(href.slice(0, -1)), href });
    });
    return dirs;
  }

  /* 探测文件夹里 index.html / index.htm 的具体文件名（仅用于构建精确链接） */
  async function probeIndex(dirHref) {
    for (const idx of ["index.html", "index.htm"]) {
      try {
        const res = await fetch(dirHref + idx, { cache: "no-store" });
        if (res.ok) return idx;
      } catch (e) { /* 继续探测下一个 */ }
    }
    return null;
  }

  async function main() {
    msgEl.classList.remove("show");
    summaryEl.textContent = "";
    listEl.innerHTML = '<div class="empty">正在扫描…</div>';

    let dirs;
    try {
      dirs = await parseRoot();
    } catch (e) {
      msgEl.innerHTML = e instanceof TypeError
        ? `无法扫描目录。<br>浏览器以 <code>file://</code> 方式打开本页时不允许读取目录，请用本地服务器打开：<br>
           ① 在本目录打开终端运行 <code>python -m http.server 8000</code><br>
           ② 浏览器访问 <code>http://localhost:8000/list.html</code>`
        : `无法读取目录列表。<br>根目录存在 <code>index.html</code> 时，服务器优先返回它而不是文件夹列表。<br>
           请删除或改名根目录的 <code>index.html</code>，然后点「🔄 刷新」。`;
      msgEl.classList.add("show");
      listEl.innerHTML = "";
      return;
    }

    // 并发探测每个文件夹的 index 文件名
    const entries = await Promise.all(
      dirs
        .sort((a, b) => a.name.localeCompare(b.name, "zh"))
        .map(async (d) => ({ name: d.name, href: d.href, idx: await probeIndex(d.href) }))
    );

    render(entries);
  }

  function render(entries) {
    // 只保留有 index 的文件夹
    entries = entries.filter((e) => e.idx);

    listEl.innerHTML = "";
    if (!entries.length) {
      summaryEl.textContent = "";
      listEl.innerHTML = '<div class="empty">当前目录下没有包含 index 页面的文件夹</div>';
      return;
    }

    summaryEl.textContent = `共 ${entries.length} 个文件夹`;

    entries.forEach((e) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = e.href + e.idx;
      a.innerHTML =
        `<span class="name">📂 ${esc(e.name)}</span>` +
        `<span class="go">打开 ↗</span>`;
      listEl.appendChild(a);
    });
  }

  document.getElementById("refreshBtn").addEventListener("click", main);
  main();
})();
</script>
</body>
</html>
