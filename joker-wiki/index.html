<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joker Wiki</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="layout">
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-logo">📓</span>
      <div>
        <div class="brand-title" id="brand-title">Joker Wiki</div>
        <div class="brand-sub" id="brand-sub">运行在 GitHub Pages 上</div>
      </div>
      <button id="btn-close-nav" class="icon-btn close-nav" title="关闭菜单">✕</button>
    </div>
    <div class="side-search">
      <input id="search-input" type="search" placeholder="搜索页面…" autocomplete="off">
      <label class="fulltext-toggle" title="勾选后回车搜索页面内容（首次较慢）">
        <input type="checkbox" id="fulltext-check"> 全文搜索
      </label>
    </div>
    <div class="side-actions">
      <button id="btn-new" class="btn btn-primary btn-block">＋ 新建页面</button>
    </div>
    <nav id="page-tree" class="page-tree"></nav>
    <div class="side-footer">
      <button id="btn-refresh" class="icon-btn" title="刷新页面列表">⟳</button>
      <button id="btn-theme" class="icon-btn" title="切换深浅主题">🌙</button>
      <div id="user-area"></div>
    </div>
  </aside>
  <main id="main">
    <header class="page-header">
      <button id="btn-menu" class="icon-btn menu-btn" title="菜单">☰</button>
      <div id="breadcrumbs" class="breadcrumbs"></div>
      <div id="header-actions" class="header-actions"></div>
    </header>
    <div id="content" class="content"></div>
  </main>
  <aside class="toc-col"><div id="toc" class="toc"></div></aside>
</div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-root"></div>
<div id="nav-backdrop" class="nav-backdrop"></div>
<noscript><p style="padding:20px">此 Wiki 需要启用 JavaScript。</p></noscript>
<script src="./lib/markdown-it.min.js"></script>
<script src="./lib/supabase.min.js"></script>
<script src="./js/config.js"></script>
<script src="./js/api.js"></script>
<script src="./js/markdown.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
